trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  PROJECT_ID: 'project-e9e43bdd-fac9-4d30-bc5'
  REGION: 'asia-south1'

steps:
  - task: DownloadSecureFile@1
    name: gcpKey
    displayName: 'Download GCP Service Account Key'
    inputs:
      secureFile: 'gcp-terraform-ci.json'

  - bash: |
      set -e
      export GOOGLE_APPLICATION_CREDENTIALS="$(gcpKey.secureFilePath)"
      gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
      gcloud config set project $(PROJECT_ID)

      # Ensure GCS backend bucket exists before terraform init
      gcloud storage buckets create gs://tf-state-$(PROJECT_ID) --location=$(REGION) 2>/dev/null || true

      terraform init
      terraform fmt -check || true
      terraform validate
      terraform plan -out=tfplan
      terraform apply -auto-approve tfplan
    displayName: 'Terraform Init, Plan & Apply'
